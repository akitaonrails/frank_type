# Auto-merge Dependabot PRs that contain no major or pre-release version
# jumps. Minor/patch updates (normally the weekly grouped PR) merge once CI
# is green; majors keep the manual pr-bump review flow.
#
# Merged PRs are closed automatically by GitHub; the repo setting
# "Automatically delete head branches" (delete_branch_on_merge) removes the
# Dependabot branch at merge time. Do NOT pass --delete-branch to
# `gh pr merge --auto`: deleting the branch before the delayed merge fires
# would close the PR unmerged.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # update-type is the highest update scope in the PR (comma-separated
      # for grouped PRs), so excluding majors and pre-releases covers every
      # dependency it contains.
      - name: Enable auto-merge
        if: >
          steps.metadata.outputs.update-type != '' &&
          !contains(steps.metadata.outputs.update-type, 'semver-major') &&
          !contains(steps.metadata.outputs.update-type, 'semver-pre')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
